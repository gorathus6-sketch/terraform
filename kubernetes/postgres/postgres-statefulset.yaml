apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bank-app
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "ledger"
        - name: POSTGRES_USER
          value: "ledger_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: worker-secret
              key: DB_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "ledger_user"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:  ["pg_isready", "-U", "ledger_user"]
          initialDelaySeconds: 10
          periodSeconds: 20
        resource:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
