apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: bank-app
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
      containers:
      - name: worker
        image: gorathus6/financial-worker:latest
        env:
        - name: DB_HOST
          value: "postgres.bank-app.svc.cluster.local"
        - name: DB_USER
          value: "worker_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: worker-secret
              key: DB_PASSWORD
        - name: QUEUE_HOST
          value: "queue.bank-app.svc.cluster.local"
        - name: QUEUE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: worker-secret
              key: QUEUE_PASSWORD
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -h $DB_HOST"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -h $DB_HOST"]
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
          limits:
            cpu: "700m"
            memory: "512Mi"