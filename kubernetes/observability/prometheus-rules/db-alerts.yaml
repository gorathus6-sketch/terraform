apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: db-alerts
  namespace: bank-observability
spec:
  groups:
  - name: db.rules
    rules:
    - alert: DatabaseHighLatency
      expr: |
        histogram_quantile(
          0.95,
          sum(rate(db_request_duration_seconds_bucket[5m])) by (le)
        ) > 0.5
      for: 10m
      labels:
        serverity: warning
        component: database
      annotations:
        summary: "High database latency"
        description: "95th percentile DB request latency is above 500ms for 10 minutes."
    - alert: DatabaseConnectionErrors
      expr: rate(db_connection_errors_total[5m]) > 0
      for: 5m
      labels:
        severity: critical
        component: database
      annotations:
        summary: "Database connection errors"
        description: "The application is experiencing database connection errors."