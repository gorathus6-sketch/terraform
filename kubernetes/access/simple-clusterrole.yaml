apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # "namespace" omitted since cluterRoles are not namespaced
  name: secret-reader
rules:
  - apiGroups: [""]
    #
    # at http level, the name of the resource for accessing secret
    # object is 'secrets'
    resources: ["secrets"]
    verbs: ["get", "watch", "list"]
